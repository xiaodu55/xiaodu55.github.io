# 定时刷新个人站点内容
#
# 用法：
# 1. 把这个文件放到 <用户名>.github.io 仓库的 .github/workflows/refresh.yml
# 2. 把站点 spec（site.json）放进仓库根，或改 SPEC 变量指向它
# 3. 需要拉取掘金文章时，把 mining 脚本一并放进去（见下方注释）
#
# 它做什么：
#   - 抓 GitHub 公开数据（star / PR 数 / 关注者 / 仓库数）
#   - 重新渲染站点并提交
#   - 站点前端还会实时向 GitHub 取数（data-live），所以即使定时任务没跑，数字也是当下的

name: Refresh site

on:
  schedule:
    - cron: "23 4 * * *"   # 每天 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: site-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public GitHub facts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_profile_facts.py --user "xiaodu55" --out facts.json

      - name: Render the site
        run: |
          python scripts/build_site.py --spec site.json --facts facts.json --out .

      - name: Commit refreshed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交。"
          else
            git commit -m "chore: 刷新站点内容"
            git push
          fi
